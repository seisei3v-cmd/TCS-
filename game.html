<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相棒AI × 人間出荷作業員 - 総合タイトル</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121214;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* --- 🎮 タイトル＆モード選択画面 --- */
    #title-screen {
      background: #1e1e24;
      border: 2px solid #2b2d42;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    #title-screen h1 {
      font-size: 24px;
      color: #00b4d8;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #title-screen .sub-title {
      font-size: 13px;
      color: #8d99ae;
      margin-bottom: 30px;
    }

    .mode-btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin: 12px 0;
      font-size: 15px;
      font-weight: bold;
      color: #121214;
      background-color: #00b4d8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      background-color: #90e0ef;
      transform: translateY(-2px);
    }

    .mode-btn.manual {
      background-color: #ffb703;
    }
    .mode-btn.manual:hover {
      background-color: #ffd166;
    }

    .mode-btn.vs-battle {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #121214;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
    }
    .mode-btn.vs-battle:hover {
      background: linear-gradient(135deg, #ffd166, #ffb703);
    }

    /* --- 🕹️ ゲーム画面用のスタイル --- */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 22px;
      color: #00b4d8;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .game-container {
      display: flex;
      gap: 20px;
      background: #1e1e24;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #2b2d42;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      position: relative;
    }

    .board-wrapper {
      position: relative;
    }

    .board {
      width: 240px;
      height: 480px;
      background-color: #0b0c10;
      border: 3px solid #00b4d8;
      border-radius: 4px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(20, 1fr);
      gap: 1px;
      position: relative;
      cursor: pointer;
    }

    .cell {
      width: 100%;
      height: 100%;
      border-radius: 2px;
      transition: border 0.1s, box-shadow 0.1s;
    }

    .cell.empty {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .cell.color-1 { background-color: #00f0f0; border: 1px solid #79f8f8; }
    .cell.color-2 { background-color: #f0f000; border: 1px solid #f8f879; }
    .cell.color-3 { background-color: #a000f0; border: 1px solid #d479f8; }
    .cell.color-4 { background-color: #00f000; border: 1px solid #79f879; }
    .cell.color-5 { background-color: #f00000; border: 1px solid #f87979; }
    .cell.color-6 { background-color: #0000f0; border: 1px solid #7979f8; }
    .cell.color-7 { background-color: #f0a000; border: 1px solid #f8d479; }

    .cell.ready-to-clear {
      border: 3px solid #ffffff !important;
      z-index: 10;
      cursor: pointer;
      animation: boldBorderFlash 0.8s infinite alternate;
    }

    @keyframes boldBorderFlash {
      0% {
        border: 3px solid #ffffff;
        box-shadow: inset 0 0 6px #ffffff, 0 0 8px #ffb703;
        transform: scale(0.98);
      }
      100% {
        border: 4px solid #ffb703;
        box-shadow: inset 0 0 12px #ffb703, 0 0 15px #ffd166;
        transform: scale(1.02);
      }
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 170px;
    }

    .info-box {
      background: #0b0c10;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2b2d42;
      margin-bottom: 10px;
    }

    .info-title {
      font-size: 11px;
      color: #8d99ae;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 20px;
      font-weight: bold;
      color: #ffb703;
    }

    .ai-status {
      background: #161a1d;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #00b4d8;
      border-left: 3px solid #00b4d8;
      margin-bottom: 10px;
      line-height: 1.4;
      min-height: 52px;
    }

    .guide {
      background: #161a1d;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #a8dadc;
      line-height: 1.5;
      border-left: 3px solid #ffb703;
    }

    .btn {
      background: #00b4d8;
      color: #121214;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
      margin-top: 10px;
    }
    .btn:hover { background: #90e0ef; }

    .btn-secondary {
      background: #2b2d42;
      color: #8d99ae;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #3d405b;
      color: #ffffff;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 12, 0.92);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 100;
    }

    .overlay h2 { color: #00b4d8; font-size: 22px; margin-bottom: 10px; }
    .overlay p { font-size: 12px; color: #c8d6e5; margin-bottom: 15px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- 🎮 1. タイトル＆モード選択画面 -->
  <div id="title-screen">
    <h1>相棒AI × 人間出荷作業員</h1>
    <div class="sub-title">〜 出荷モード選択 〜</div>

    <button class="mode-btn" onclick="startNormalMode()">
      🎮 ノーマルモード (AI出荷・シングル)
    </button>

    <button class="mode-btn manual" onclick="location.href='game2.html'">
      📦 マニュアルモード (自作ミノ・一人用)
    </button>

    <button class="mode-btn vs-battle" onclick="location.href='game3.html'">
      ⚔️ 対戦モード (1v1 VS CPU / 2P)
    </button>
  </div>

  <!-- 🕹️ 2. ノーマルゲーム画面 -->
  <div id="game-screen">
    <div class="header">
      <h1>相棒AI × 人間出荷作業員</h1>
      <div class="sub-title">3列以上の連続出荷で高得点ボーナスを狙え！</div>
    </div>

    <div class="game-container">
      <div class="board-wrapper">
        <div class="board" id="board"></div>
      </div>

      <div class="side-panel">
        <div>
          <div class="info-box">
            <div class="info-title">REMAIN TIME</div>
            <div class="info-value" id="timer">600s</div>
          </div>

          <div class="info-box">
            <div class="info-title">SCORE</div>
            <div class="info-value" id="score">0</div>
          </div>

          <div class="ai-status" id="ai-msg">
            AI: 「思考ルーチン起動...」
          </div>
        </div>

        <div class="guide">
          <strong>【ボーナスルール】</strong><br>
          1〜2列：通常出荷<br>
          <strong>3列連続：+50pt</strong><br>
          <strong>4列連続：+80pt</strong><br>
          <strong>5列以上：+300pt！</strong>
        </div>

        <button class="btn" onclick="startGame()">シフト開始</button>
        <button class="btn btn-secondary" onclick="returnToTitle()">タイトルへ</button>
      </div>

      <!-- リザルト画面 -->
      <div class="overlay" id="overlay" style="display: none;">
        <h2 id="overlay-title">連続出荷ボーナス版</h2>
        <p id="overlay-desc">
          AIがどんどんブロックを組み上げます。<br>
          揃った列は1〜2列でも消せますが、<br>
          <strong>3列以上繋げて消すと大ボーナス！</strong>
        </p>
        <button class="btn" onclick="startGame()">業務スタート</button>
        <button class="btn btn-secondary" onclick="returnToTitle()">タイトルへ戻る</button>
      </div>
    </div>
  </div>

  <script>
    const ROWS = 20;
    const COLS = 10;
    
    const SHAPES = [
      [],
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[0,1,0],[1,1,1]], // T
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]], // Z
      [[1,0,0],[1,1,1]], // J
      [[0,0,1],[1,1,1]]  // L
    ];

    let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    let score = 0;
    let timeLeft = 600;
    let isPlaying = false;
    let gameLoopInterval = null;
    let timerInterval = null;

    let currentPiece = null;
    let currentR = 0;
    let currentC = 0;
    let currentTypeId = 0;

    let targetRotation = 0;
    let targetC = 0;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const overlay = document.getElementById('overlay');
    const aiMsgEl = document.getElementById('ai-msg');

    function startNormalMode() {
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      initBoardUI();
    }

    function returnToTitle() {
      isPlaying = false;
      if (gameLoopInterval) clearInterval(gameLoopInterval);
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('title-screen').style.display = 'block';
    }

    function initBoardUI() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell', 'empty');
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener('click', handleCellClick);
          boardEl.appendChild(cell);
        }
      }
    }

    function rotatePiece(piece) {
      const R = piece.length;
      const C = piece[0].length;
      let rotated = Array(C).fill().map(() => Array(R).fill(0));
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < C; c++) {
          rotated[c][R - 1 - r] = piece[r][c];
        }
      }
      return rotated;
    }

    function render() {
      const fullRows = getFullRows();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const index = r * COLS + c;
          const cell = boardEl.children[index];
          cell.className = 'cell';

          let colorVal = grid[r][c];

          if (currentPiece) {
            const pr = r - currentR;
            const pc = c - currentC;
            if (pr >= 0 && pr < currentPiece.length && pc >= 0 && pc < currentPiece[0].length) {
              if (currentPiece[pr][pc]) {
                colorVal = currentTypeId;
              }
            }
          }

          if (colorVal > 0) {
            cell.classList.add(`color-${colorVal}`);
          } else {
            cell.classList.add('empty');
          }

          if (fullRows.includes(r)) {
            cell.classList.add('ready-to-clear');
          }
        }
      }

      if (fullRows.length >= 3) {
        aiMsgEl.style.color = '#ffb703';
        aiMsgEl.innerHTML = `AI: 「3列以上揃った！<br>大ボーナスのチャンス！」`;
      } else if (fullRows.length > 0) {
        aiMsgEl.style.color = '#00b4d8';
        aiMsgEl.innerHTML = `AI: 「ライン完成！<br>さらに溜めてボーナス狙う？」`;
      } else {
        aiMsgEl.style.color = '#00b4d8';
        aiMsgEl.innerHTML = `AI: 「最適回転を計算...<br>組み立て進行中！」`;
      }
    }

    function getFullRows() {
      let fullRows = [];
      for (let r = 0; r < ROWS; r++) {
        if (grid[r].every(val => val > 0)) {
          fullRows.push(r);
        }
      }
      return fullRows;
    }

    function findBestMove(basePiece) {
      let bestScore = -999999;
      let bestRot = 0;
      let bestC = 0;

      let tempPiece = basePiece;

      for (let rot = 0; rot < 4; rot++) {
        for (let c = 0; c <= COLS - tempPiece[0].length; c++) {
          let r = 0;
          if (checkCollision(r, c, tempPiece)) continue;

          while (!checkCollision(r + 1, c, tempPiece)) {
            r++;
          }

          let score = r * 15;
          let holes = 0;

          let tempGrid = grid.map(row => [...row]);
          for (let pr = 0; pr < tempPiece.length; pr++) {
            for (let pc = 0; pc < tempPiece[0].length; pc++) {
              if (tempPiece[pr][pc]) {
                tempGrid[r + pr][c + pc] = currentTypeId;
              }
            }
          }

          for (let col = 0; col < COLS; col++) {
            let blockFound = false;
            for (let row = 0; row < ROWS; row++) {
              if (tempGrid[row][col] > 0) blockFound = true;
              else if (blockFound && tempGrid[row][col] === 0) holes++;
            }
          }

          score -= holes * 30;

          if (score > bestScore) {
            bestScore = score;
            bestRot = rot;
            bestC = c;
          }
        }
        tempPiece = rotatePiece(tempPiece);
      }

      return { rot: bestRot, col: bestC };
    }

    function spawnPiece() {
      currentTypeId = Math.floor(Math.random() * 7) + 1;
      let basePiece = SHAPES[currentTypeId];
      currentR = 0;

      const best = findBestMove(basePiece);
      targetRotation = best.rot;
      targetC = best.col;

      currentPiece = basePiece;
      currentC = Math.floor((COLS - currentPiece[0].length) / 2);

      if (checkCollision(currentR, currentC, currentPiece)) {
        endGame(false, "ブロックが溢れて作業が停止しました！");
      }
    }

    function checkCollision(r, c, piece) {
      for (let pr = 0; pr < piece.length; pr++) {
        for (let pc = 0; pc < piece[0].length; pc++) {
          if (piece[pr][pc]) {
            const newR = r + pr;
            const newC = c + pc;
            if (newR >= ROWS || newC < 0 || newC >= COLS) return true;
            if (newR >= 0 && grid[newR][newC] > 0) return true;
          }
        }
      }
      return false;
    }

    function aiTick() {
      if (!currentPiece) return;

      if (targetRotation > 0) {
        const nextRotPiece = rotatePiece(currentPiece);
        if (!checkCollision(currentR, currentC, nextRotPiece)) {
          currentPiece = nextRotPiece;
          targetRotation--;
          render();
          return;
        }
      }

      if (currentC < targetC && !checkCollision(currentR, currentC + 1, currentPiece)) {
        currentC++;
      } else if (currentC > targetC && !checkCollision(currentR, currentC - 1, currentPiece)) {
        currentC--;
      } else {
        if (!checkCollision(currentR + 1, currentC, currentPiece)) {
          currentR++;
        } else {
          lockPiece();
          spawnPiece();
        }
      }
      render();
    }

    function lockPiece() {
      for (let pr = 0; pr < currentPiece.length; pr++) {
        for (let pc = 0; pc < currentPiece[0].length; pc++) {
          if (currentPiece[pr][pc]) {
            const r = currentR + pr;
            const c = currentC + pc;
            if (r >= 0 && r < ROWS) {
              grid[r][c] = currentTypeId;
            }
          }
        }
      }
      currentPiece = null;
    }

    function handleCellClick(e) {
      if (!isPlaying) return;

      const clickedRow = parseInt(e.target.dataset.r);
      const fullRows = getFullRows();

      if (fullRows.includes(clickedRow)) {
        let targetRows = [clickedRow];

        let rAbove = clickedRow - 1;
        while (rAbove >= 0 && fullRows.includes(rAbove)) {
          targetRows.push(rAbove);
          rAbove--;
        }

        let rBelow = clickedRow + 1;
        while (rBelow < ROWS && fullRows.includes(rBelow)) {
          targetRows.push(rBelow);
          rBelow++;
        }

        const count = targetRows.length;

        let newGrid = grid.filter((row, index) => !targetRows.includes(index));
        for (let i = 0; i < count; i++) {
          newGrid.unshift(Array(COLS).fill(0));
        }
        grid = newGrid;

        let baseScore = count * 100;
        let bonusScore = 0;

        if (count === 3) {
          bonusScore = 50;
        } else if (count === 4) {
          bonusScore = 80;
        } else if (count >= 5) {
          bonusScore = 300;
        }

        const totalEarned = baseScore + bonusScore;
        score += totalEarned;
        scoreEl.textContent = score;

        if (bonusScore > 0) {
          aiMsgEl.style.color = '#ffb703';
          aiMsgEl.innerHTML = `AI: 「${count}列連続出荷！！<br>ボーナス +${bonusScore}pt 獲得！（計 ${totalEarned}pt）モデル」`;
        } else {
          aiMsgEl.style.color = '#00b4d8';
          aiMsgEl.innerHTML = `AI: 「${count}列出荷完了！<br>（3列以上でボーナス発生！）」`;
        }

        render();
      }
    }

    function startGame() {
      grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
      score = 0;
      timeLeft = 600;
      isPlaying = true;

      scoreEl.textContent = score;
      timerEl.textContent = `${timeLeft}s`;
      overlay.style.display = 'none';

      initBoardUI();
      spawnPiece();
      render();

      if (gameLoopInterval) clearInterval(gameLoopInterval);
      if (timerInterval) clearInterval(timerInterval);

      gameLoopInterval = setInterval(aiTick, 100);

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;

        if (timeLeft <= 0) {
          endGame(true, "10分間の出荷勤務が無事終了しました！");
        }
      }, 1000);
    }

    function endGame(isSuccess, message) {
      isPlaying = false;
      clearInterval(gameLoopInterval);
      clearInterval(timerInterval);

      document.getElementById('overlay-title').textContent = isSuccess ? "勤務完了！" : "現場崩壊...";
      document.getElementById('overlay-desc').innerHTML = `${message}<br><br>最終出荷スコア: <strong>${score}</strong> PT`;
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
